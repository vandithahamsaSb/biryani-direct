{% extends 'core/base.html' %}
{% block title %}Order {{ order.order_id }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 text-center">
        <div class="card border-0 shadow-sm p-4">
            <i class="bi bi-check-circle-fill text-success" style="font-size: 3.5rem;"></i>
            <h3 class="fw-bold mt-2">Order Confirmed!</h3>
            <p class="text-muted">Order Reference: <strong>{{ order.order_id }}</strong></p>
            <div class="bg-light p-3 rounded mb-3">
                <h5 class="fw-bold text-uppercase" id="status-text">{{ order.get_status_display }}</h5>
            </div>
            <a href="{% url 'outlet_select' %}" class="btn btn-saffron">Order More</a>
        </div>
    </div>
</div>
{% endblock %}
