{% extends 'core/base.html' %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-5">
        <div class="card p-4 shadow-lg border-0 rounded-4">
            <h3 class="fw-bold text-center mb-4" style="color: #E65100;">🔐 Login to Biryani Direct</h3>
            
            <form method="post">
                {% csrf_token %}
                {% if form.non_field_errors %}
                    <div class="alert alert-danger rounded-pill px-3">{{ form.non_field_errors }}</div>
                {% endif %}
                
                <div class="mb-3">
                    <label class="form-label fw-semibold">Username</label>
                    <input type="text" name="username" class="form-control rounded-pill px-3" placeholder="Enter username" required>
                </div>
                
                <div class="mb-4">
                    <label class="form-label fw-semibold">Password</label>
                    <input type="password" name="password" class="form-control rounded-pill px-3" placeholder="Enter password" required>
                </div>
                
                <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-bold shadow-sm" style="font-size: 1.1rem;">
                    🔑 Login Now
                </button>
            </form>

            <div class="text-center mt-4">
                <small class="text-muted">Don't have an account? <a href="{% url 'register' %}" class="btn btn-outline-dark btn-sm rounded-pill px-3 ms-2">Register Here</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
