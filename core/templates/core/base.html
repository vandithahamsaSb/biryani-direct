<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biryani Direct | Hyderabadi Chain</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* Soft Light Saffron Background */
        html, body { 
            background-color: #FFF0E5 !important; 
            font-family: 'Inter', sans-serif;
            color: #2D2D2D;
            min-height: 100vh;
        }
        h1, h2, h3, h4 { font-family: 'Playfair Display', serif; }
        .navbar { background-color: #FFFFFF !important; border-bottom: 3px solid #FFD8BE !important; }
        .btn-primary { background-color: #E65100 !important; border: none !important; color: #FFFFFF !important; }
        .btn-primary:hover { background-color: #BF360C !important; }
        .card { background-color: #FFFFFF !important; border: none !important; border-radius: 16px !important; box-shadow: 0 6px 16px rgba(230, 81, 0, 0.08) !important; }
        .card:hover { transform: translateY(-4px); box-shadow: 0 10px 24px rgba(230, 81, 0, 0.15) !important; }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg sticky-top py-3 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/" style="font-size: 1.6rem; color: #E65100;">
                👑 🍲 Biryani Direct
            </a>
            <div class="ms-auto d-flex align-items-center gap-3">
                {% if user.is_authenticated %}
                    <a href="{% url 'cart_view' %}" class="btn btn-outline-warning text-dark btn-sm rounded-pill px-3">🛒 Cart</a>
                    <span class="fw-semibold text-dark">Hi, {{ user.username }}</span>
                    <a href="{% url 'logout' %}" class="btn btn-outline-dark btn-sm rounded-pill px-3">Logout</a>
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-primary rounded-pill px-4 shadow-sm">Login</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container mt-4 flex-grow-1">
        {% block content %}{% endblock %}
    </div>

    <footer class="py-4 mt-5 text-center border-top" style="border-color: #FFD8BE !important; background-color: #FFF5EE;">
        <p class="mb-0 fw-semibold text-dark">© 2024 Biryani Direct • Authentic Hyderabadi Chain • FSSAI License: 12345678901234</p>
    </footer>
</body>
</html>
